version: '3.8'

services:
  node-red:
    build: .
    container_name: nziot-node-red
    restart: unless-stopped
    ports:
      - '1880:1880' # 宿主机 1880
    volumes:
      - node-red-data:/app/nziot/data # 流程文件持久化
    environment:
      # 平台后端地址（Node-RED 用它校验 accessToken）
      # 测试环境直连后端；生产环境改成 Nginx 或内网地址
      - NZIOT_PLATFORM_API=http://192.168.3.96:19092
      # 凭据加密密钥。第一次启动后不能改，否则已保存的凭据解不回来。
      - NODE_RED_CREDENTIAL_SECRET=nziot-prod-secret

volumes:
  node-red-data:
    driver: local
