version: "3.8"

services:
  node-red:
    build: .
    container_name: nziot-node-red
    restart: unless-stopped
    ports:
      - "127.0.0.1:1880:1880"      # 只绑本机，由 Nginx 反代对外
    volumes:
      - node-red-data:/app/nziot/data   # 流程文件持久化
    environment:
      # 测试环境不填 token = 不启用鉴权，任何人都能访问编辑器。
      # 生产环境改成后端签发的 nodeToken 值（逗号分隔多个）。
      - NODE_RED_TOKENS=
      # 凭据加密密钥。第一次启动后不能改，否则已保存的凭据解不回来。
      - NODE_RED_CREDENTIAL_SECRET=nziot-prod-secret

volumes:
  node-red-data:
    driver: local
